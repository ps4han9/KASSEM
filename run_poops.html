<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KASSEM X STORE - Poops</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --primary-red: #e60023; --bg-dark: #0a0a0c; --panel-bg: rgba(12, 12, 15, 0.92); }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh; background: #000 url('bg.jpg') no-repeat center center fixed; background-size: cover;
    color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden;
  }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(230,0,35,0.05) 0%, rgba(0,0,0,0.95) 100%); z-index: 0; }

  .armor-panel {
    position: relative; z-index: 1; width: 95%; max-width: 850px; background: var(--panel-bg);
    border: 1px solid #222; border-top: 5px solid var(--primary-red); border-bottom: 5px solid var(--primary-red);
    padding: 40px 30px; border-radius: 15px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(230, 0, 35, 0.1);
  }

  .brand-title { font-family: 'Black Ops One', 'Orbitron', cursive; font-size: 4rem; text-align: center; color: #fff; letter-spacing: 5px; margin-bottom: 5px; text-transform: uppercase; direction: ltr; text-shadow: 0 5px 15px rgba(0,0,0,0.8); }
  .brand-title span { color: var(--primary-red); text-shadow: 0 0 20px var(--primary-red); }
  .brand-sub { font-size: 1.2rem; text-align: center; color: #aaa; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; direction: ltr; }

  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 8px; border: 1px solid rgba(230, 0, 35, 0.3); margin-bottom: 15px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
  .status-panel::before { content: '● EXECUTION'; position: absolute; top: -12px; right: 15px; background: var(--primary-red); color: #fff; padding: 2px 12px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 4px; box-shadow: 0 0 10px var(--primary-red); }

  #state { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(230, 0, 35, 0.6); text-align: center; margin-bottom: 10px; }
  
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; animation: bounce 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--primary-red); box-shadow: 0 0 10px var(--primary-red); } .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }

  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 14px; max-height: 250px; overflow-y: auto; color: #c8ced8; direction: ltr; text-align: left; }

  .done { color: #00ff88 !important; text-shadow: 0 0 10px #00ff88 !important; }
  .error { color: var(--primary-red) !important; text-shadow: 0 0 10px var(--primary-red) !important; }
  .footer-sys { position: fixed; bottom: 10px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 2; }

  @media (max-width: 600px) { .brand-title { font-size: 2.5rem; } .brand-sub { font-size: 1rem; } }
</style>
</head>
<body>

<div class="armor-panel">
  <h1 class="brand-title">KASSEM <span>X</span> STORE</h1>
  <div class="brand-sub">POOPS EXPLOIT</div>

  <div class="status-panel">
    <div id="state">
      <span id="stateText">جارٍ تحميل سلسلة Poops<br><small>Please Wait...</small></span>
      <div class="loader-wrapper">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  
  <div id="out-container"><div id="out"></div></div>
</div>

<div class="footer-sys">KASSEM X STORE OS v3.0 - Poops</div>

<script type="module">
import "./chain_poops.js";

const state = document.getElementById("state");
const stateText = document.getElementById("stateText");

window.poopsDone = function () {
  state.classList.add("done");
  stateText.innerHTML = "اكتملت العملية بنجاح<br><small>EXPLOIT SUCCESSFUL</small>";
  document.querySelector('.loader-wrapper').style.display = 'none';
};

window.poopsError = function () {
  state.classList.add("error");
  stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>EXPLOIT FAILED</small>";
  document.querySelector('.loader-wrapper').style.display = 'none';
};
</script>
</body>
</html>

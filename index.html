<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KASSEM X STORE - PRO JAILBREAK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --primary-red: #e60023;
    --dark-red: #8a0015;
    --bg-dark: #0a0a0c;
    --panel-bg: rgba(12, 12, 15, 0.92);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: #000 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    display: flex; align-items: center; justify-content: center;
    direction: rtl; overflow: hidden;
  }

  /* تعتيم الخلفية بطابع أحمر خفيف */
  body::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(230,0,35,0.05) 0%, rgba(0,0,0,0.95) 100%);
    z-index: 0;
  }

  /* الحاوية الأساسية (ستايل درع/مدرع) */
  .armor-panel {
    position: relative; z-index: 1; width: 95%; max-width: 850px;
    background: var(--panel-bg);
    border: 1px solid #222;
    border-top: 5px solid var(--primary-red);
    border-bottom: 5px solid var(--primary-red);
    padding: 45px 30px;
    border-radius: 15px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(230, 0, 35, 0.1);
  }

  .brand-title {
    font-family: 'Black Ops One', 'Orbitron', cursive; font-size: 5rem;
    text-align: center; color: #fff; letter-spacing: 5px; margin-bottom: 5px;
    text-transform: uppercase; direction: ltr;
    text-shadow: 0 5px 15px rgba(0,0,0,0.8);
  }
  
  .brand-title span {
    color: var(--primary-red);
    text-shadow: 0 0 20px var(--primary-red);
  }

  .brand-sub {
    font-size: 1.3rem; text-align: center; color: #aaa;
    font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 30px; direction: ltr;
  }

  /* شاشة الفحص (تيرمينال أحمر) */
  .status-panel {
    background: rgba(0, 0, 0, 0.8); padding: 25px; border-radius: 8px;
    border: 1px solid rgba(230, 0, 35, 0.3);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    margin-bottom: 30px; position: relative;
  }

  .status-panel::before {
    content: '● SYSTEM SCAN'; position: absolute; top: -12px; right: 15px;
    background: var(--primary-red); color: #fff; padding: 2px 12px;
    font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 4px;
    box-shadow: 0 0 10px var(--primary-red);
  }

  #state { font-size: 26px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 12px; text-shadow: 0 0 10px rgba(230, 0, 35, 0.6); }
  #det { font-size: 18px; color: #aebfd3; text-align: center; line-height: 1.8; }
  #det b { color: #fff; background: var(--dark-red); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--primary-red); }
  #cache { font-size: 14px; color: #8192a8; text-align: center; margin-top: 15px; font-weight: bold; }
  #cache.cacheok { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }
  .ok { color: #00ff88; } .bad { color: var(--primary-red); } .warn { color: #fdd663; }

  /* كروت التواصل */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .contact-card {
    background: linear-gradient(145deg, rgba(30,30,35,0.9), rgba(15,15,18,0.9));
    padding: 20px; border-radius: 10px;
    border-right: 4px solid var(--primary-red);
    transition: 0.3s;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .contact-card.full { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; text-align: right; }
  .contact-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(230, 0, 35, 0.15); }
  
  .c-title { color: #aaa; font-size: 14px; font-weight: 800; margin-bottom: 8px; display: block; }
  .full .c-title { margin-bottom: 0; margin-left: 20px; font-size: 16px; color: var(--primary-red); }
  .c-val { color: #fff; font-size: 20px; font-weight: 900; direction: ltr; }
  .full .c-val { font-size: 16px; direction: rtl; line-height: 1.6; flex: 1; }

  .footer-sys { position: fixed; bottom: 10px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 2; }

  @media (max-width: 768px) {
    .brand-title { font-size: 3.5rem; } .armor-panel { padding: 30px 15px; }
    .contact-grid { grid-template-columns: 1fr; }
    .contact-card.full { flex-direction: column; text-align: center; }
    .full .c-title { margin-left: 0; margin-bottom: 10px; } .full .c-val { text-align: center; }
  }
</style>
</head>
<body>

<div class="armor-panel">
  
  <h1 class="brand-title">KASSEM <span>X</span> STORE</h1>
  <div class="brand-sub">PS4 Jailbreak 11.00 - 12.00 - 13.00</div>

  <div class="status-panel">
    <div id="state">جارٍ فحص النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>

  <div class="contact-grid">
    <div class="contact-card full">
      <span class="c-title">📍 العنوان</span>
      <span class="c-val">الشرقية - أولاد صقر - خلف مجلس المدينة</span>
    </div>
    <div class="contact-card">
      <span class="c-title">📱 موبايل (1)</span>
      <span class="c-val">01091536999</span>
    </div>
    <div class="contact-card">
      <span class="c-title">📱 موبايل (2)</span>
      <span class="c-val">01015854462</span>
    </div>
  </div>

</div>

<div class="footer-sys">KASSEM X STORE OS v3.0</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { stateEl.innerHTML = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = "> " + t; cacheEl.className = ok ? "cacheok" : ""; }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "تم التحديد يدوياً ?bug=" + forced;
    } else if (!key) {
        why = "تحذير: هذا المتصفح ليس بلايستيشن 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = "النظام مدعوم: توجيه مسار (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = "النظام مدعوم: توجيه مسار (Poops)";
    } else {
        why = "تحذير: هذا الإصدار غير مدعوم حالياً";
    }

    var fwDisplay = key ? "<b>V_" + key + "</b>" : "<span style='color:#8f9eb0;'>UNKNOWN</span>";
    var bugDisplay = bug ? "<b style='color:var(--primary-red);'>" + bug.toUpperCase() + "_CHAIN</b>" : "<span style='color:#8f9eb0;'>N/A</span>";

    detEl.innerHTML = "OS_VERSION: " + fwDisplay + " | EXPLOIT: " + bugDisplay + "<br><br><span style='color: #fff; font-size:16px;'>" + why + "</span>";

    if (!bug) { setState("إصدار غير مدعوم ACCESS DENIED", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;

    function go() {
        setState("جارٍ تهيئة الثغرة INITIATING...", "warn");
        setTimeout(function() { location.replace(target); }, 500);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) { go(); }
    else if (!navigator.onLine) { setCache("وضع الأوفلاين نشط", true); go(); }
    else if (ac.status === ac.IDLE) { setCache("ملفات الكاش جاهزة للاستخدام", true); go(); }
    else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث بنجاح", true);
        waitForTap("تحديث جاهز — اضغط للتنفيذ", function () { location.reload(); });
    } else {
        setCache("جارٍ فحص التخزين المؤقت...");
        ac.addEventListener("downloading", function () { setCache("يتم سحب الملفات للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) { if (e && e.total) { setCache("جاري التخزين: " + Math.round((e.loaded / e.total) * 100) + "%"); } }, false);
        ac.addEventListener("cached", function () { setCache("اكتمل التخزين — يمكنك الاستخدام بدون نت", true); waitForTap("النظام جاهز — اضغط للتشغيل", go); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} setCache("التحديث جاهز", true); waitForTap("تحديث متوفر — اضغط لإعادة التحميل", function () { location.reload(); }); }, false);
        ac.addEventListener("noupdate", function () { setCache("التخزين المؤقت محدث وجاهز", true); go(); }, false);
        ac.addEventListener("error", function () { setCache("حدث خطأ في سحب الكاش"); waitForTap("فشل التخزين — اضغط للتشغيل الإجباري", go); }, false);
        ac.addEventListener("obsolete", function () { setCache("ملفات الكاش قديمة"); waitForTap("تنبيه ملفات قديمة — اضغط للتشغيل", go); }, false);
    }
})();
</script>
</body>
</html>
